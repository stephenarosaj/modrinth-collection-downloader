<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Modrinth Collection Downloader — Environment Selection, Auto-Selected Dependency Highlight, and Toast">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1100" height="500" fill="#0f172a" />

  <!-- Floating Auto-Select Toast Notification -->
  <rect x="620" y="20" width="440" height="46" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
  <text x="644" y="48" class="font" font-size="13.5" font-weight="600" fill="#e0f2fe">Auto-selected Fabric API, Cloth Config API (Client)</text>

  <!-- Mods Table Slice Showing Selection & Flash -->
  <rect x="40" y="84" width="1020" height="386" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="64" y="118" class="font" font-size="16" font-weight="700" fill="#f8fafc">Mods — Selection &amp; Dependency Auto-Selection</text>

  <!-- Table Header -->
  <rect x="41" y="134" width="1018" height="42" fill="#0f172a" />
  <text x="104" y="160" class="font" font-size="12" font-weight="700" fill="#94a3b8">NAME</text>
  <text x="360" y="160" class="font" font-size="12" font-weight="700" fill="#94a3b8">PLATFORM</text>
  <rect x="480" y="147" width="15" height="15" rx="3" fill="#10b981" />
  <text x="484" y="159" class="font" font-size="11" font-weight="700" fill="#042f2e">✓</text>
  <text x="504" y="160" class="font" font-size="12" font-weight="700" fill="#f8fafc">CLIENT (All selected)</text>
  <rect x="760" y="147" width="15" height="15" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
  <text x="784" y="160" class="font" font-size="12" font-weight="700" fill="#94a3b8">SERVER (Locked — Toggle Off)</text>

  <!-- Collection Row: Mod Menu -->
  <line x1="41" y1="176" x2="1059" y2="176" stroke="#334155" stroke-width="1" />
  <circle cx="72" cy="212" r="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="72" y="217" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#10b981">✓</text>
  <text x="104" y="206" class="font" font-size="14" font-weight="600" fill="#f8fafc">Mod Menu</text>
  <text x="104" y="226" class="font" font-size="12" fill="#38bdf8">Open on Modrinth ↗</text>
  <rect x="360" y="198" width="58" height="24" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="389" y="214" text-anchor="middle" class="font" font-size="12" fill="#e2e8f0">Fabric</text>

  <!-- Client Cell Checked by User -->
  <rect x="480" y="196" width="15" height="15" rx="3" fill="#10b981" />
  <text x="484" y="208" class="font" font-size="11" font-weight="700" fill="#042f2e">✓</text>
  <rect x="504" y="190" width="166" height="28" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="514" y="208" class="mono" font-size="12" fill="#f8fafc">7.2.2</text>
  <text x="654" y="208" class="font" font-size="11" fill="#94a3b8">▾</text>
  <rect x="678" y="194" width="58" height="20" rx="4" fill="#1e293b" stroke="#475569" />
  <text x="707" y="208" text-anchor="middle" class="font" font-size="11" fill="#cbd5e1">optional</text>

  <!-- Server Cell Unsupported -->
  <text x="760" y="214" class="font" font-size="13" fill="#475569">✗ Unsupported</text>

  <!-- Dependencies Footer Header -->
  <rect x="41" y="248" width="1018" height="32" fill="#0f172a" />
  <text x="64" y="269" class="font" font-size="11.5" font-weight="700" fill="#94a3b8">DEPENDENCIES (2)</text>

  <!-- Dependency 1: Fabric API (Flashing Auto-Selected Cell) -->
  <line x1="41" y1="280" x2="1059" y2="280" stroke="#334155" stroke-width="1" />
  <circle cx="72" cy="322" r="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="72" y="327" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#10b981">✓</text>
  <text x="104" y="314" class="font" font-size="14" font-weight="600" fill="#f8fafc">Fabric API</text>
  <text x="104" y="334" class="font" font-size="11.5" fill="#94a3b8">Required by: <tspan fill="#e2e8f0">Mod Menu (client)</tspan></text>
  <rect x="360" y="308" width="58" height="24" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="389" y="324" text-anchor="middle" class="font" font-size="12" fill="#e2e8f0">Fabric</text>

  <!-- Flashing Auto-Selected Cell Box -->
  <rect x="470" y="290" width="272" height="62" rx="8" fill="#0c4a6e" fill-opacity="0.45" stroke="#38bdf8" stroke-width="2" />
  <rect x="480" y="312" width="15" height="15" rx="3" fill="#10b981" />
  <text x="484" y="324" class="font" font-size="11" font-weight="700" fill="#042f2e">✓</text>
  <rect x="504" y="306" width="166" height="28" rx="5" fill="#0f172a" stroke="#38bdf8" />
  <text x="514" y="324" class="mono" font-size="12" fill="#f8fafc">0.92.2+1.20.1</text>
  <rect x="678" y="310" width="52" height="20" rx="4" fill="#0284c7" />
  <text x="704" y="324" text-anchor="middle" class="font" font-size="11" font-weight="600" fill="#f0f9ff">(auto)</text>

  <!-- Locked Server Cell -->
  <rect x="760" y="312" width="15" height="15" rx="3" fill="#1e293b" stroke="#475569" />
  <text x="784" y="324" class="mono" font-size="12" fill="#64748b">0.92.2+1.20.1 (locked)</text>

  <!-- Dependency 2: Cloth Config API (User Explicitly Unchecked -> Warning) -->
  <rect x="41" y="364" width="1018" height="92" fill="#451a03" fill-opacity="0.25" />
  <line x1="41" y1="364" x2="1059" y2="364" stroke="#334155" stroke-width="1" />
  <circle cx="72" cy="408" r="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
  <text x="72" y="413" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#f59e0b">⚠</text>
  <text x="104" y="400" class="font" font-size="14" font-weight="600" fill="#f8fafc">Cloth Config API</text>
  <text x="104" y="420" class="font" font-size="11.5" fill="#94a3b8">Required by: <tspan fill="#e2e8f0">Mod Menu (client)</tspan></text>
  <rect x="360" y="394" width="58" height="24" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="389" y="410" text-anchor="middle" class="font" font-size="12" fill="#e2e8f0">Fabric</text>

  <!-- User-Off Cell with Warning Ring -->
  <rect x="470" y="376" width="272" height="66" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="480" y="398" width="15" height="15" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="504" y="392" width="150" height="28" rx="5" fill="#0f172a" stroke="#334155" />
  <text x="514" y="410" class="mono" font-size="12" fill="#94a3b8">11.1.136+fabric</text>
  <rect x="662" y="396" width="68" height="20" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
  <text x="696" y="410" text-anchor="middle" class="font" font-size="11" fill="#fcd34d">user off</text>
</svg>
