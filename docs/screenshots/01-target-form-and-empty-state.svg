<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-label="Modrinth Collection Downloader — Target Form and Getting Started Empty State">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1100" height="580" fill="#0f172a" />

  <!-- Header -->
  <text x="40" y="54" class="font" font-size="24" font-weight="700" fill="#f8fafc">Modrinth Collection Downloader</text>
  <text x="40" y="80" class="font" font-size="14" fill="#94a3b8">Build, review, and export client and server instances from a Modrinth collection.</text>

  <!-- Target Configuration Card -->
  <rect x="40" y="104" width="1020" height="200" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />

  <!-- Input 1: Collection URL or ID -->
  <text x="64" y="136" class="font" font-size="13" font-weight="600" fill="#f8fafc">Collection URL or ID</text>
  <rect x="64" y="146" width="380" height="38" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="76" y="170" class="mono" font-size="13" fill="#f8fafc">https://modrinth.com/collection/5OBQuutT</text>

  <!-- Input 2: Game version -->
  <text x="464" y="136" class="font" font-size="13" font-weight="600" fill="#f8fafc">Game version</text>
  <rect x="464" y="146" width="260" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="476" y="170" class="font" font-size="13" fill="#f8fafc">1.20.1</text>
  <text x="702" y="170" class="font" font-size="12" fill="#94a3b8">▾</text>

  <!-- Input 3: Platform -->
  <text x="744" y="136" class="font" font-size="13" font-weight="600" fill="#f8fafc">Platform</text>
  <rect x="744" y="146" width="292" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="756" y="170" class="font" font-size="13" fill="#f8fafc">Fabric</text>
  <text x="1014" y="170" class="font" font-size="12" fill="#94a3b8">▾</text>

  <!-- Release preference checkbox -->
  <rect x="64" y="204" width="16" height="16" rx="4" fill="#10b981" />
  <text x="68" y="216" class="font" font-size="12" font-weight="700" fill="#042f2e">✓</text>
  <text x="88" y="217" class="font" font-size="13" fill="#e2e8f0">Prefer stable releases over newest alpha/beta</text>

  <!-- Buttons Row -->
  <rect x="64" y="242" width="168" height="38" rx="6" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="148" y="266" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#f8fafc">Import instance.json</text>

  <rect x="244" y="242" width="148" height="38" rx="6" fill="#10b981" />
  <text x="318" y="266" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#042f2e">Load collection</text>

  <!-- Getting Started Empty State Card -->
  <rect x="40" y="328" width="1020" height="212" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="64" y="366" class="font" font-size="17" font-weight="700" fill="#f8fafc">Ready to build an instance</text>
  <text x="64" y="394" class="font" font-size="14" fill="#94a3b8">Enter a Modrinth collection URL or ID above to resolve compatible project versions and required dependencies, or import a saved instance.json file offline.</text>

  <circle cx="76" cy="430" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="76" y="434" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#38bdf8">1</text>
  <text x="98" y="435" class="font" font-size="13.5" fill="#e2e8f0"><tspan font-weight="600" fill="#f8fafc">Configure Target:</tspan> Paste a collection link (e.g. https://modrinth.com/collection/...) and pick your Game version and Platform.</text>

  <circle cx="76" cy="466" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="76" y="470" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#38bdf8">2</text>
  <text x="98" y="471" class="font" font-size="13.5" fill="#e2e8f0"><tspan font-weight="600" fill="#f8fafc">Review Environments:</tspan> Unlock the Client and/or Server environment columns to customize selections and versions.</text>

  <circle cx="76" cy="502" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="76" y="506" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#38bdf8">3</text>
  <text x="98" y="507" class="font" font-size="13.5" fill="#e2e8f0"><tspan font-weight="600" fill="#f8fafc">Export Outputs:</tspan> Package client.zip, server.zip, portable instance.json, or a Modrinth .mrpack archive.</text>
</svg>
