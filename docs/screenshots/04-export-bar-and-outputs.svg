<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" role="img" aria-label="Modrinth Collection Downloader — Export Bar, Outputs, and Download Progress">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1100" height="380" fill="#0f172a" />

  <!-- Export Card -->
  <rect x="40" y="24" width="1020" height="332" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="64" y="60" class="font" font-size="17" font-weight="700" fill="#f8fafc">Export Instance</text>
  <text x="64" y="84" class="font" font-size="13" fill="#94a3b8">Export per-environment zip archives, a portable instance.json snapshot, or a Modrinth .mrpack package.</text>

  <!-- Primary Export Buttons Row -->
  <!-- Export client.zip -->
  <rect x="64" y="106" width="190" height="40" rx="6" fill="#10b981" />
  <text x="159" y="131" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#042f2e">Export client.zip (4)</text>

  <!-- Export server.zip -->
  <rect x="268" y="106" width="190" height="40" rx="6" fill="#10b981" />
  <text x="363" y="131" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#042f2e">Export server.zip (3)</text>

  <!-- Export instance.json -->
  <rect x="472" y="106" width="180" height="40" rx="6" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="562" y="131" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#f8fafc">Export instance.json</text>

  <!-- Platform version (optional) + Export .mrpack -->
  <text x="676" y="100" class="font" font-size="11.5" font-weight="600" fill="#cbd5e1">Platform version (optional)</text>
  <rect x="676" y="106" width="160" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="690" y="131" class="mono" font-size="13" fill="#f8fafc">0.16.9</text>

  <rect x="850" y="106" width="180" height="40" rx="6" fill="#0284c7" />
  <text x="940" y="131" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#f0f9ff">Export .mrpack (5)</text>

  <!-- Plugin Exclusion Warning Banner -->
  <rect x="64" y="164" width="966" height="42" rx="6" fill="#451a03" fill-opacity="0.45" stroke="#f59e0b" stroke-width="1" />
  <text x="82" y="190" class="font" font-size="12.5" fill="#fde68a">⚠ Note: .mrpack format does not support plugins. 1 selected plugin will be excluded from .mrpack: <tspan font-weight="600">Chunky</tspan></text>

  <!-- Live Zip Export Progress Panel -->
  <rect x="64" y="222" width="966" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="86" y="252" class="font" font-size="13.5" font-weight="600" fill="#f8fafc">Exporting 5OBQuutT-client.zip — Downloading binaries (3 / 4)</text>
  <text x="86" y="274" class="mono" font-size="12" fill="#94a3b8">mods/Sodium-Fabric-1.20.1-mc1.20.1-0.5.11.jar</text>

  <!-- Progress Bar Track & Fill -->
  <rect x="86" y="290" width="780" height="14" rx="7" fill="#1e293b" />
  <rect x="86" y="290" width="585" height="14" rx="7" fill="#10b981" />

  <!-- Cancel Export Button -->
  <rect x="886" y="276" width="124" height="34" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
  <text x="948" y="298" text-anchor="middle" class="font" font-size="12.5" font-weight="600" fill="#fecaca">Cancel export</text>
</svg>
